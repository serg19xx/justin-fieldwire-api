<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Rules Management - FieldWire Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen">
    <div x-data="eventRulesManager()" class="container mx-auto px-4 py-8">
        <!-- Header -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="text-3xl font-bold text-gray-900">
                        <i class="fas fa-cogs mr-3 text-blue-600"></i>
                        Event Rules Management
                    </h1>
                    <p class="text-gray-600 mt-2">Configure event notification rules and permissions</p>
                </div>
                <button @click="showCreateModal = true" 
                        class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg flex items-center">
                    <i class="fas fa-plus mr-2"></i>
                    Add New Rule
                </button>
            </div>
        </div>

        <!-- Statistics Cards -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-6">
            <div class="bg-white rounded-lg shadow-md p-6">
                <div class="flex items-center">
                    <div class="p-3 rounded-full bg-green-100 text-green-600">
                        <i class="fas fa-check-circle text-xl"></i>
                    </div>
                    <div class="ml-4">
                        <p class="text-sm font-medium text-gray-600">Total Rules</p>
                        <p class="text-2xl font-bold text-gray-900" x-text="rules.length"></p>
                    </div>
                </div>
            </div>
            
            <div class="bg-white rounded-lg shadow-md p-6">
                <div class="flex items-center">
                    <div class="p-3 rounded-full bg-blue-100 text-blue-600">
                        <i class="fas fa-toggle-on text-xl"></i>
                    </div>
                    <div class="ml-4">
                        <p class="text-sm font-medium text-gray-600">Enabled</p>
                        <p class="text-2xl font-bold text-gray-900" x-text="enabledCount"></p>
                    </div>
                </div>
            </div>
            
            <div class="bg-white rounded-lg shadow-md p-6">
                <div class="flex items-center">
                    <div class="p-3 rounded-full bg-red-100 text-red-600">
                        <i class="fas fa-exclamation-triangle text-xl"></i>
                    </div>
                    <div class="ml-4">
                        <p class="text-sm font-medium text-gray-600">Critical</p>
                        <p class="text-2xl font-bold text-gray-900" x-text="criticalCount"></p>
                    </div>
                </div>
            </div>
            
            <div class="bg-white rounded-lg shadow-md p-6">
                <div class="flex items-center">
                    <div class="p-3 rounded-full bg-yellow-100 text-yellow-600">
                        <i class="fas fa-info-circle text-xl"></i>
                    </div>
                    <div class="ml-4">
                        <p class="text-sm font-medium text-gray-600">Important</p>
                        <p class="text-2xl font-bold text-gray-900" x-text="importantCount"></p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Rules Table -->
        <div class="bg-white rounded-lg shadow-md overflow-hidden">
            <div class="px-6 py-4 border-b border-gray-200">
                <h2 class="text-xl font-semibold text-gray-900">Event Rules</h2>
            </div>
            
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Event Type</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Severity</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Comment</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Updated</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200">
                        <template x-for="rule in rules" :key="rule.event_type">
                            <tr class="hover:bg-gray-50">
                                <td class="px-6 py-4 whitespace-nowrap">
                                    <div class="text-sm font-medium text-gray-900" x-text="rule.event_type"></div>
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap">
                                    <span :class="rule.enabled ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'" 
                                          class="inline-flex px-2 py-1 text-xs font-semibold rounded-full">
                                        <i :class="rule.enabled ? 'fas fa-check' : 'fas fa-times'" class="mr-1"></i>
                                        <span x-text="rule.enabled ? 'Enabled' : 'Disabled'"></span>
                                    </span>
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap">
                                    <span :class="rule.severity === 'critical' ? 'bg-red-100 text-red-800' : 'bg-yellow-100 text-yellow-800'" 
                                          class="inline-flex px-2 py-1 text-xs font-semibold rounded-full">
                                        <i :class="rule.severity === 'critical' ? 'fas fa-exclamation-triangle' : 'fas fa-info-circle'" class="mr-1"></i>
                                        <span x-text="rule.severity"></span>
                                    </span>
                                </td>
                                <td class="px-6 py-4">
                                    <div class="flex flex-wrap gap-1">
                                        <template x-for="action in rule.actions" :key="action">
                                            <span class="inline-flex px-2 py-1 text-xs font-medium bg-blue-100 text-blue-800 rounded">
                                                <i class="fas fa-bell mr-1"></i>
                                                <span x-text="action"></span>
                                            </span>
                                        </template>
                                    </div>
                                </td>
                                <td class="px-6 py-4">
                                    <div class="text-sm text-gray-900" x-text="rule.comment || '-'"></div>
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" x-text="formatDate(rule.updated_at)"></td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                                    <div class="flex space-x-2">
                                        <button @click="editRule(rule)" 
                                                class="text-blue-600 hover:text-blue-900">
                                            <i class="fas fa-edit"></i>
                                        </button>
                                        <button @click="deleteRule(rule.event_type)" 
                                                class="text-red-600 hover:text-red-900">
                                            <i class="fas fa-trash"></i>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Create/Edit Modal -->
        <div x-show="showCreateModal || showEditModal" 
             x-transition:enter="transition ease-out duration-300"
             x-transition:enter-start="opacity-0"
             x-transition:enter-end="opacity-100"
             x-transition:leave="transition ease-in duration-200"
             x-transition:leave-start="opacity-100"
             x-transition:leave-end="opacity-0"
             class="fixed inset-0 z-50 overflow-y-auto" 
             style="display: none;">
            <div class="flex items-center justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
                <div class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity" @click="closeModal()"></div>
                
                <div class="inline-block align-bottom bg-white rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg sm:w-full">
                    <form @submit.prevent="saveRule()">
                        <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
                            <div class="sm:flex sm:items-start">
                                <div class="mx-auto flex-shrink-0 flex items-center justify-center h-12 w-12 rounded-full bg-blue-100 sm:mx-0 sm:h-10 sm:w-10">
                                    <i class="fas fa-cogs text-blue-600"></i>
                                </div>
                                <div class="mt-3 text-center sm:mt-0 sm:ml-4 sm:text-left w-full">
                                    <h3 class="text-lg leading-6 font-medium text-gray-900" x-text="showEditModal ? 'Edit Event Rule' : 'Create New Event Rule'"></h3>
                                    
                                    <div class="mt-4 space-y-4">
                                        <!-- Event Type -->
                                        <div x-show="!showEditModal">
                                            <label class="block text-sm font-medium text-gray-700">Event Type</label>
                                            <input type="text" 
                                                   x-model="formData.event_type" 
                                                   placeholder="e.g., PROJECT_CREATED"
                                                   class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                                                   required>
                                        </div>
                                        
                                        <!-- Enabled -->
                                        <div>
                                            <label class="flex items-center">
                                                <input type="checkbox" 
                                                       x-model="formData.enabled" 
                                                       class="rounded border-gray-300 text-blue-600 shadow-sm focus:border-blue-300 focus:ring focus:ring-blue-200 focus:ring-opacity-50">
                                                <span class="ml-2 text-sm text-gray-700">Enabled</span>
                                            </label>
                                        </div>
                                        
                                        <!-- Severity -->
                                        <div>
                                            <label class="block text-sm font-medium text-gray-700">Severity</label>
                                            <select x-model="formData.severity" 
                                                    class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                                                    required>
                                                <option value="">Select severity</option>
                                                <option value="important">Important</option>
                                                <option value="critical">Critical</option>
                                            </select>
                                        </div>
                                        
                                        <!-- Actions -->
                                        <div>
                                            <label class="block text-sm font-medium text-gray-700">Actions</label>
                                            <div class="mt-1 space-y-2">
                                                <template x-for="(action, index) in formData.actions" :key="index">
                                                    <div class="flex">
                                                        <input type="text" 
                                                               x-model="formData.actions[index]" 
                                                               placeholder="Action name"
                                                               class="flex-1 border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                                                               required>
                                                        <button type="button" 
                                                                @click="removeAction(index)"
                                                                class="ml-2 text-red-600 hover:text-red-800">
                                                            <i class="fas fa-times"></i>
                                                        </button>
                                                    </div>
                                                </template>
                                                <button type="button" 
                                                        @click="addAction()"
                                                        class="text-blue-600 hover:text-blue-800 text-sm">
                                                    <i class="fas fa-plus mr-1"></i>
                                                    Add Action
                                                </button>
                                            </div>
                                        </div>
                                        
                                        <!-- Comment -->
                                        <div>
                                            <label class="block text-sm font-medium text-gray-700">Comment</label>
                                            <textarea x-model="formData.comment" 
                                                      rows="3"
                                                      placeholder="Optional description"
                                                      class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm"></textarea>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="bg-gray-50 px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse">
                            <button type="submit" 
                                    class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-blue-600 text-base font-medium text-white hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 sm:ml-3 sm:w-auto sm:text-sm">
                                <span x-text="showEditModal ? 'Update Rule' : 'Create Rule'"></span>
                            </button>
                            <button type="button" 
                                    @click="closeModal()"
                                    class="mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 sm:mt-0 sm:ml-3 sm:w-auto sm:text-sm">
                                Cancel
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Loading Overlay -->
        <div x-show="loading" 
             class="fixed inset-0 z-50 flex items-center justify-center bg-gray-500 bg-opacity-75"
             style="display: none;">
            <div class="bg-white rounded-lg p-6 flex items-center">
                <i class="fas fa-spinner fa-spin text-blue-600 mr-3"></i>
                <span class="text-gray-700">Loading...</span>
            </div>
        </div>

        <!-- Toast Notifications -->
        <div x-show="toast.show" 
             x-transition:enter="transition ease-out duration-300"
             x-transition:enter-start="opacity-0 transform translate-y-2"
             x-transition:enter-end="opacity-100 transform translate-y-0"
             x-transition:leave="transition ease-in duration-200"
             x-transition:leave-start="opacity-100 transform translate-y-0"
             x-transition:leave-end="opacity-0 transform translate-y-2"
             class="fixed top-4 right-4 z-50"
             style="display: none;">
            <div :class="toast.type === 'success' ? 'bg-green-500' : 'bg-red-500'" 
                 class="text-white px-6 py-3 rounded-lg shadow-lg">
                <div class="flex items-center">
                    <i :class="toast.type === 'success' ? 'fas fa-check-circle' : 'fas fa-exclamation-circle'" 
                       class="mr-2"></i>
                    <span x-text="toast.message"></span>
                </div>
            </div>
        </div>
    </div>

    <script>
        function eventRulesManager() {
            return {
                rules: [],
                loading: false,
                showCreateModal: false,
                showEditModal: false,
                formData: {
                    event_type: '',
                    enabled: true,
                    actions: [''],
                    severity: '',
                    comment: ''
                },
                toast: {
                    show: false,
                    type: 'success',
                    message: ''
                },

                init() {
                    this.loadRules();
                },

                async loadRules() {
                    this.loading = true;
                    try {
                        const response = await fetch('/api/v1/admin/event-rules', {
                            headers: {
                                'Authorization': `Bearer ${localStorage.getItem('token')}`
                            }
                        });
                        
                        if (response.ok) {
                            const data = await response.json();
                            this.rules = data.data.rules;
                        } else {
                            this.showToast('Failed to load rules', 'error');
                        }
                    } catch (error) {
                        this.showToast('Error loading rules', 'error');
                    } finally {
                        this.loading = false;
                    }
                },

                async saveRule() {
                    this.loading = true;
                    try {
                        const url = this.showEditModal 
                            ? `/api/v1/admin/event-rules/${this.formData.event_type}`
                            : '/api/v1/admin/event-rules';
                        
                        const method = this.showEditModal ? 'PUT' : 'POST';
                        
                        const response = await fetch(url, {
                            method: method,
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${localStorage.getItem('token')}`
                            },
                            body: JSON.stringify(this.formData)
                        });
                        
                        if (response.ok) {
                            this.showToast(
                                this.showEditModal ? 'Rule updated successfully' : 'Rule created successfully', 
                                'success'
                            );
                            this.closeModal();
                            this.loadRules();
                        } else {
                            const error = await response.json();
                            this.showToast(error.message || 'Failed to save rule', 'error');
                        }
                    } catch (error) {
                        this.showToast('Error saving rule', 'error');
                    } finally {
                        this.loading = false;
                    }
                },

                async deleteRule(eventType) {
                    if (!confirm('Are you sure you want to delete this rule?')) {
                        return;
                    }
                    
                    this.loading = true;
                    try {
                        const response = await fetch(`/api/v1/admin/event-rules/${eventType}`, {
                            method: 'DELETE',
                            headers: {
                                'Authorization': `Bearer ${localStorage.getItem('token')}`
                            }
                        });
                        
                        if (response.ok) {
                            this.showToast('Rule deleted successfully', 'success');
                            this.loadRules();
                        } else {
                            this.showToast('Failed to delete rule', 'error');
                        }
                    } catch (error) {
                        this.showToast('Error deleting rule', 'error');
                    } finally {
                        this.loading = false;
                    }
                },

                editRule(rule) {
                    this.formData = {
                        event_type: rule.event_type,
                        enabled: rule.enabled,
                        actions: [...rule.actions],
                        severity: rule.severity,
                        comment: rule.comment || ''
                    };
                    this.showEditModal = true;
                },

                addAction() {
                    this.formData.actions.push('');
                },

                removeAction(index) {
                    this.formData.actions.splice(index, 1);
                },

                closeModal() {
                    this.showCreateModal = false;
                    this.showEditModal = false;
                    this.formData = {
                        event_type: '',
                        enabled: true,
                        actions: [''],
                        severity: '',
                        comment: ''
                    };
                },

                showToast(message, type = 'success') {
                    this.toast = { show: true, message, type };
                    setTimeout(() => {
                        this.toast.show = false;
                    }, 3000);
                },

                formatDate(dateString) {
                    return new Date(dateString).toLocaleDateString();
                },

                get enabledCount() {
                    return this.rules.filter(rule => rule.enabled).length;
                },

                get criticalCount() {
                    return this.rules.filter(rule => rule.severity === 'critical').length;
                },

                get importantCount() {
                    return this.rules.filter(rule => rule.severity === 'important').length;
                }
            }
        }
    </script>
</body>
</html>
